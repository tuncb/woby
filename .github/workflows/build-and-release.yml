name: Build and Test

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  VCPKG_DISABLE_METRICS: "1"

jobs:
  build:
    name: Build ${{ matrix.package_name }}
    runs-on: ${{ matrix.os }}
    env:
      WOBY_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package_name: woby-windows-x64
            vcpkg_triplet: woby-ci-x64-windows
            archive_extension: zip
          - os: ubuntu-latest
            package_name: woby-linux-x64
            vcpkg_triplet: woby-ci-x64-linux
            archive_extension: tar.gz
          - os: macos-latest
            package_name: woby-macos-arm64
            vcpkg_triplet: woby-ci-arm64-osx
            archive_extension: tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "Could not find vswhere.exe at '$vswhere'."
          }

          $vsPath = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vsPath) {
            throw "Could not find a Visual Studio installation with the MSVC x64 toolchain."
          }

          $vsDevCmd = Join-Path $vsPath "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path -LiteralPath $vsDevCmd -PathType Leaf)) {
            throw "Could not find VsDevCmd.bat at '$vsDevCmd'."
          }

          $beforeEnv = Join-Path $env:RUNNER_TEMP "woby-msvc-env-before.txt"
          $afterEnv = Join-Path $env:RUNNER_TEMP "woby-msvc-env-after.txt"
          $envScript = Join-Path $env:RUNNER_TEMP "woby-msvc-env.cmd"
          Set-Content -LiteralPath $envScript -Encoding ASCII -Value @(
            "@echo off",
            "set > ""$beforeEnv""",
            "call ""$vsDevCmd"" -arch=x64 -host_arch=x64",
            "if errorlevel 1 exit /b %errorlevel%",
            "set > ""$afterEnv"""
          )

          & cmd /s /c "`"$envScript`""
          if ($LASTEXITCODE -ne 0) {
            throw "VsDevCmd.bat failed with exit code $LASTEXITCODE."
          }

          $before = @{}
          foreach ($line in Get-Content -LiteralPath $beforeEnv) {
            if ($line -match "^([^=]+)=(.*)$") {
              $before[$matches[1]] = $matches[2]
            }
          }

          foreach ($line in Get-Content -LiteralPath $afterEnv) {
            if ($line -match "^([^=]+)=(.*)$") {
              $name = $matches[1]
              $value = $matches[2]
              if ((-not $before.ContainsKey($name)) -or ($before[$name] -cne $value)) {
                "$name=$value" >> $env:GITHUB_ENV
              }
            }
          }

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            autoconf-archive \
            automake \
            bison \
            build-essential \
            curl \
            flex \
            libasound2-dev \
            libdbus-1-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libibus-1.0-dev \
            libltdl-dev \
            libpulse-dev \
            libtool \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libxrender-dev \
            libxss-dev \
            libxtst-dev \
            nasm \
            ninja-build \
            pkg-config \
            python3 \
            tar \
            unzip \
            wayland-protocols \
            zip

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool nasm ninja pkg-config

      - name: Test CI helpers
        shell: pwsh
        run: node --test .github/scripts/ci-config.test.cjs .github/scripts/resolve-release-build.test.cjs

      - name: Prepare pinned CI manifest and cache identity
        id: ci
        shell: pwsh
        env:
          WOBY_CI_TRIPLET: ${{ matrix.vcpkg_triplet }}
        run: |
          if ($IsWindows) {
            $compiler = Get-Item (Get-Command cl.exe).Source
            $env:WOBY_CI_COMPILER_ID = "$($compiler.VersionInfo.FileVersion);$env:VCToolsVersion;$env:WindowsSDKVersion"
          } else {
            $env:WOBY_CI_COMPILER_ID = (& c++ --version) -join "`n"
            if ($LASTEXITCODE -ne 0) { throw "Could not identify the C++ compiler." }
          }
          node .github/scripts/ci-config.cjs

      - name: Restore vcpkg packages
        id: vcpkg-cache
        uses: actions/cache/restore@v5
        with:
          path: .vcpkg-cache
          key: ${{ steps.ci.outputs.cache-key }}
          restore-keys: ${{ steps.ci.outputs.restore-prefix }}

      - name: Prepare vcpkg cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force ".vcpkg-cache" | Out-Null

      - name: Check out pinned vcpkg
        uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.ci.outputs.revision }}
          path: .vcpkg
          persist-credentials: false

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          if ($IsWindows) {
            & "$env:WOBY_VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          } else {
            & "$env:WOBY_VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          }

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B "build/${{ matrix.package_name }}" `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:WOBY_VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_MANIFEST_DIR="$env:GITHUB_WORKSPACE/build/ci-vcpkg" `
            -DVCPKG_OVERLAY_TRIPLETS="$env:GITHUB_WORKSPACE/cmake/vcpkg-triplets" `
            -DVCPKG_TARGET_TRIPLET="${{ matrix.vcpkg_triplet }}" `
            -DVCPKG_HOST_TRIPLET="${{ matrix.vcpkg_triplet }}"

      # Preserve completed dependencies even when compiling or testing Woby later fails.
      - name: Save vcpkg packages
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .vcpkg-cache
          key: ${{ steps.ci.outputs.cache-key }}

      - name: Build
        shell: pwsh
        run: cmake --build "build/${{ matrix.package_name }}" --config Release --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir "build/${{ matrix.package_name }}" --build-config Release --output-on-failure

      - name: Stage runtime files
        shell: pwsh
        run: |
          $packageName = "${{ matrix.package_name }}"
          $buildDir = Join-Path $env:GITHUB_WORKSPACE "build/$packageName"
          $binDir = Join-Path $buildDir "bin"
          $stageRoot = Join-Path $env:GITHUB_WORKSPACE "dist"
          $stageDir = Join-Path $stageRoot $packageName

          New-Item -ItemType Directory -Force $stageDir | Out-Null

          if ($IsWindows) {
            Copy-Item (Join-Path $binDir "woby.exe") $stageDir -Force
            Copy-Item (Join-Path $binDir "woby-update-helper.exe") $stageDir -Force
            Get-ChildItem $binDir -Filter "*.dll" -File | Copy-Item -Destination $stageDir -Force
          } elseif ($IsMacOS) {
            $executable = Join-Path $binDir "woby"
            $stagedExecutable = Join-Path $stageDir "woby"

            function Get-MachORpaths([string]$binaryPath) {
              $lines = otool -l $binaryPath

              for ($index = 0; $index -lt $lines.Count; $index++) {
                if ($lines[$index].Trim() -eq "cmd LC_RPATH") {
                  for ($offset = $index; $offset -lt [Math]::Min($index + 6, $lines.Count); $offset++) {
                    if ($lines[$offset] -match "^\s*path\s+(.+?)\s+\(offset") {
                      $matches[1]
                    }
                  }
                }
              }
            }

            function Add-MachORpathIfMissing([string]$binaryPath, [string]$rpath) {
              $existingRpaths = @(Get-MachORpaths $binaryPath)

              if ($existingRpaths -notcontains $rpath) {
                install_name_tool -add_rpath $rpath $binaryPath
              }
            }

            Copy-Item $executable $stageDir -Force
            chmod +x $stagedExecutable
            Copy-Item (Join-Path $binDir "woby-update-helper") $stageDir -Force
            chmod +x (Join-Path $stageDir "woby-update-helper")

            $vcpkgLibDirs = @(
              (Join-Path $buildDir "vcpkg_installed/${{ matrix.vcpkg_triplet }}/lib"),
              (Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed/${{ matrix.vcpkg_triplet }}/lib")
            ) | Where-Object { Test-Path -LiteralPath $_ -PathType Container } | Select-Object -Unique

            foreach ($vcpkgLibDir in $vcpkgLibDirs) {
              Get-ChildItem $vcpkgLibDir -Filter "*.dylib" -File | Copy-Item -Destination $stageDir -Force
            }

            Add-MachORpathIfMissing $stagedExecutable "@executable_path"
            $stagedHelper = Join-Path $stageDir "woby-update-helper"
            Add-MachORpathIfMissing $stagedHelper "@executable_path"
            $helperDeps = otool -L $stagedHelper | Select-Object -Skip 1 | ForEach-Object {
              if ($_ -match "^\s+(.+?)\s+\(") { $matches[1] }
            } | Where-Object { $_ -and $_.StartsWith($env:GITHUB_WORKSPACE) } | Sort-Object -Unique
            foreach ($dependency in $helperDeps) {
              Copy-Item $dependency $stageDir -Force
              $dependencyName = Split-Path $dependency -Leaf
              install_name_tool -change $dependency "@executable_path/$dependencyName" $stagedHelper
            }

            $runtimeDeps = otool -L $executable |
              Select-Object -Skip 1 |
              ForEach-Object {
                if ($_ -match "^\s+(.+?)\s+\(") {
                  $matches[1]
                }
              } |
              Where-Object { $_ -and $_.StartsWith($env:GITHUB_WORKSPACE) } |
              Sort-Object -Unique

            foreach ($dependency in $runtimeDeps) {
              Copy-Item $dependency $stageDir -Force
            }

            foreach ($dependency in $runtimeDeps) {
              $dependencyName = Split-Path $dependency -Leaf
              install_name_tool -change $dependency "@executable_path/$dependencyName" $stagedExecutable
            }

            $stagedDylibs = Get-ChildItem $stageDir -Filter "*.dylib" -File
            foreach ($dylib in $stagedDylibs) {
              install_name_tool -id "@rpath/$($dylib.Name)" $dylib.FullName
              Add-MachORpathIfMissing $dylib.FullName "@loader_path"

              $nestedDeps = otool -L $dylib.FullName |
                Select-Object -Skip 1 |
                ForEach-Object {
                  if ($_ -match "^\s+(.+?)\s+\(") {
                    $matches[1]
                  }
                } |
                Where-Object { $_ -and $_.StartsWith($env:GITHUB_WORKSPACE) } |
                Sort-Object -Unique

              foreach ($nestedDependency in $nestedDeps) {
                $nestedDependencyName = Split-Path $nestedDependency -Leaf
                install_name_tool -change $nestedDependency "@executable_path/$nestedDependencyName" $dylib.FullName
              }
            }
          } else {
            $executable = Join-Path $binDir "woby"
            Copy-Item $executable $stageDir -Force
            chmod +x (Join-Path $stageDir "woby")
            Copy-Item (Join-Path $binDir "woby-update-helper") $stageDir -Force
            chmod +x (Join-Path $stageDir "woby-update-helper")

            $runtimeDeps = ldd $executable (Join-Path $binDir "woby-update-helper") |
              ForEach-Object {
                if ($_ -match "=>\s+(/\S+)") {
                  $matches[1]
                } elseif ($_ -match "^\s*(/\S+)") {
                  $matches[1]
                }
              } |
              Where-Object { $_ -and $_.StartsWith($env:GITHUB_WORKSPACE) } |
              Sort-Object -Unique

            foreach ($dependency in $runtimeDeps) {
              Copy-Item $dependency $stageDir -Force
            }
          }

          Copy-Item (Join-Path $binDir "assets") $stageDir -Recurse -Force

          $fontPath = Join-Path $stageDir "assets/fonts/RobotoMonoNerdFont-Regular.ttf"
          if (-not (Test-Path -LiteralPath $fontPath -PathType Leaf)) {
            throw "Expected app font is missing from package staging path: $fontPath"
          }

          Get-ChildItem $stageDir -Recurse -File |
            Select-Object FullName, Length |
            Format-Table -AutoSize

      - name: Generate verified package manifest
        shell: pwsh
        run: python .github/scripts/package_manifest.py generate "dist/${{ matrix.package_name }}" "${{ runner.os == 'Windows' && 'windows-x64' || runner.os == 'macOS' && 'macos-arm64' || 'linux-x64' }}"

      - name: Create package
        id: package
        shell: pwsh
        run: |
          $packageName = "${{ matrix.package_name }}"
          $archivePath = Join-Path $env:GITHUB_WORKSPACE "dist/$packageName.${{ matrix.archive_extension }}"
          $stageRoot = Join-Path $env:GITHUB_WORKSPACE "dist"
          $stageDir = Join-Path $stageRoot $packageName

          if ($IsWindows) {
            Compress-Archive -Path $stageDir -DestinationPath $archivePath -Force
          } else {
            tar -C $stageRoot -czf $archivePath $packageName
          }

          "archive=$archivePath" >> $env:GITHUB_OUTPUT

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package_name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
