    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #586e77" x="285" y="844.857422" transform="rotate(-0 285 844.857422)">shared pointCloud owner</text>
   </g>
   <g id="text_28">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203139" x="41" y="1253.669375" transform="rotate(-0 41 1253.669375)">Later CPU addition: Mesh.annotationCache → MeshAnnotationCache</text>
   </g>
   <g id="text_29">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #203139" transform="translate(41 1277.570625)">B · blocks · 11.839 MB   |   O · spatial triangle offsets · 303.088 MB   |   H · tree · 150.995 MB</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #203139" transform="translate(41 1294.51125)">B/O/H add 465.922 MB of populated payload after the background worker completes.</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #203139" transform="translate(41 1311.31125)">H alone has 170.079 MB of measured allocation capacity.</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #203139" transform="translate(41 1328.11125)">The cache shares MeshGeometry above; it reads the same V/I without copying them.</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #203139" transform="translate(41 1344.91125)">O refers to original triangle offsets in I. H/B store bounds and index ranges; group fingerprints are small.</text>
   </g>
   <g id="text_30">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #586e77" x="25" y="1461" transform="rotate(-0 25 1461)">Released construction data: U, C, parsed face records F, corner lookup tables, membership scratch and sort keys.</text>
   </g>
   <g id="text_31">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #586e77" x="25" y="1490" transform="rotate(-0 25 1490)">The OBJ text is not retained as a full text buffer. Windows file-cache pages are outside this model inventory.</text>
   </g>
   <g id="text_32">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #586e77" x="25" y="1519" transform="rotate(-0 25 1519)">Sizes are populated payloads. This diagram does not measure the complete process working set or upload staging.</text>
   </g>
  </g>
