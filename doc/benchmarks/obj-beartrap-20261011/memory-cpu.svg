   <g id="text_13">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203139" x="41" y="684.258438" transform="rotate(-0 41 684.258438)">LoadedModelRuntime.gpuMesh (CPU struct)</text>
   </g>
   <g id="text_14">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #203139" transform="translate(41 709.71125)">Graphics handles + GpuNodeRange records</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #203139" transform="translate(41 726.51125)">pointCloud → shared const points::Cloud</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #203139" transform="translate(41 743.31125)">pointChunks / proxyChunks hold GPU handles.</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #203139" transform="translate(41 760.11125)">The handles refer to GPU allocations; their bytes are separate.</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203139" x="611" y="684.845781" transform="rotate(-0 611 684.845781)">UiState.files[0] → UiFileState</text>
   </g>
   <g id="text_16">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #203139" transform="translate(611 709.71125)">Mesh holds the geometry/source owners shown above.</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #203139" transform="translate(611 726.51125)">G · one UiGroupState: bounds, colour and transforms</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #203139" transform="translate(611 743.31125)">File settings, origin and whole-mesh bounds</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #203139" transform="translate(611 760.11125)">These CPU controls produce per-frame draw parameters.</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203139" x="45" y="930.637812" transform="rotate(-0 45 930.637812)">points::Cloud · retained on the CPU, including after GPU upload</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203139" x="61" y="988.669375" transform="rotate(-0 61 988.669375)">L · sourceVertices</text>
   </g>
   <g id="text_19">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #203139" transform="translate(61 1013.767812)">153.658 MB</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #203139" transform="translate(61 1029.967813)">L[id - 1] → render ID</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #203139" transform="translate(61 1046.31125)">Then M → P for precision</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203139" x="321" y="987.313125" transform="rotate(-0 321 987.313125)">Q · points</text>
   </g>
   <g id="text_21">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #203139" transform="translate(321 1013.767812)">614.630 MB</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #203139" transform="translate(321 1030.67375)">Float XYZ + marker ID</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #203139" transform="translate(321 1046.31125)">Spatially ordered originals</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203139" x="581" y="987.313125" transform="rotate(-0 581 987.313125)">R · proxies</text>
   </g>
   <g id="text_23">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #203139" transform="translate(581 1013.767812)">70.077 MB</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #203139" transform="translate(581 1030.67375)">Float XYZ + marker ID</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #203139" transform="translate(581 1046.31125)">Samples from Q</text>
   </g>
   <g id="text_24">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203139" x="841" y="988.669375" transform="rotate(-0 841 988.669375)">T · nodes</text>
   </g>
   <g id="text_25">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #203139" transform="translate(841 1013.767812)">2.490 MB</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #203139" transform="translate(841 1029.51125)">32,767 range/bounds nodes</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #203139" transform="translate(841 1046.31125)">Ranges select Q or R</text>
   </g>
   <g id="text_26">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #586e77" x="45" y="1123" transform="rotate(-0 45 1123)">Also retained: roots, group records and prepared navigation cuts. Q/R have additional GPU copies.</text>
   </g>
