   <g id="text_1">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203139" x="20" y="30.917344" transform="rotate(-0 20 30.917344)">CPU RAM: retained structures at scene publication</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="36" y="91.258437" transform="rotate(-0 36 91.258437)">Known CPU array payload: 4.952 GB (4.612 GiB)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(36 116.71125)">Mesh arrays: 4.111 GB populated; 4.774 GB allocated capacity.</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(36 133.51125)">Point arrays: 840.855 MB populated. Small metadata and spare capacity are additional.</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203139" x="41" y="247.258437" transform="rotate(-0 41 247.258437)">UiFileState.mesh.storage → MeshGeometry</text>
   </g>
   <g id="text_5">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #203139" transform="translate(41 273.261563)">V · vertices · 1,229.261 MB</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #203139" transform="translate(41 290.67375)">I · indices · 909.264 MB</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #203139" transform="translate(41 306.31125)">M · positionIndices · 153.658 MB</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #203139" transform="translate(41 323.11125)">MeshNode ranges plus sourcePositions → P</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203139" x="611" y="248.669375" transform="rotate(-0 611 248.669375)">UiFileState.mesh.sourceData → SourceMeshData</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #203139" transform="translate(611 273.87375)">S · indices · 909.264 MB</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #203139" transform="translate(611 289.51125)">positions → P</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #203139" transform="translate(611 306.31125)">S refers directly to precise source positions.</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #203139" transform="translate(611 323.11125)">No second position array is retained.</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203139" x="186" y="512.313125" transform="rotate(-0 186 512.313125)">P · one shared precise-position vector</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #203139" transform="translate(186 538.261563)">37,890,645 double XYZ records · 909.375 MB</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #203139" transform="translate(186 554.51125)">Both sourcePositions pointers refer to this same allocation.</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #203139" transform="translate(186 571.31125)">Render vertex i uses P[M[i]]; add Mesh.origin for original coordinates.</text>
   </g>
