   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203139" x="36" y="550.669375" transform="rotate(-0 36 550.669375)">New vertex: read P and U</text>
   </g>
