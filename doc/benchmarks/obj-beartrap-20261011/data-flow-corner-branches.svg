   <g id="text_1">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203139" x="241" y="45.669375" transform="rotate(-0 241 45.669375)">C: 227.316 M corner references</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #203139" transform="translate(241 69.71125)">Each corner stores a position ID, UV ID and normal ID.</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #203139" transform="translate(241 87.061563)">These are references to P and U, not render vertex IDs.</text>
   </g>
